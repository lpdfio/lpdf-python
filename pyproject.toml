[project]
name = "lpdfio-lpdf"
version = "0.0.0"
description = "Python SDK for Lpdf — PDF as Code on every platform. You describe a document as code or XML. Lpdf renders a compact, pixel-perfect PDF — identical across platforms."
readme = "README.md"
requires-python = ">=3.11"
# The engine runs inside Python on the wasmtime package. No upper bound: the weekly CI run tests the newest.
dependencies = ["wasmtime>=50"]
license = {file = "LICENSE"}
authors = [{name = "lpdf.io", email = "support@lpdf.io"}]
keywords = ["pdf", "wasm", "xml", "document"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://lpdf.io"
Repository = "https://github.com/lpdfio/lpdf-python"
Issues = "https://github.com/lpdfio/lpdf/issues"
Changelog = "https://github.com/lpdfio/lpdf/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpdf"]

# The engine binary lives beside the package, where default_wasm_binary() looks: src/resources/ in
# the repo (the workflows download it there), resources/ next to lpdf/ once installed.
[tool.hatch.build.targets.wheel.force-include]
"src/resources" = "resources"

[tool.hatch.build]
include = ["src/lpdf/**", "src/resources/**"]
